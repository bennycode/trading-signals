name: 'Release'

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Create PAT at:
          # https://github.com/settings/personal-access-tokens
          # Repository permissions: "Contents" (Read and write)
          token: ${{ secrets.RELEASE_TOKEN }}
      # A fresh runner has no git identity, so lerna's version commit fails with
      # "empty ident name" before it can tag or publish anything.
      - name: 'Identity'
        run: |
          git config user.name 'Benny Neugebauer'
          git config user.email 'mail@bennycode.com'
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: 'Install'
        run: npm ci
      - name: 'Audit'
        run: npm audit signatures
      - name: 'Test'
        run: |
          npm run lint
          npm test
      - name: 'Build'
        run: npm run dist
      - name: 'Publish'
        run: npx lerna publish --yes
      - name: 'Summary'
        if: always()
        run: |
          {
            echo "### Published"
            git tag --points-at HEAD | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
