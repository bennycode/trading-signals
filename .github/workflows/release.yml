name: 'Release'

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:

concurrency:
  group: 'release'
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_AUTOMERGE_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: 'Install dependencies'
        run: npm ci
      - name: 'Verify provenance and registry signatures of installed dependencies'
        run: npm audit signatures
      - name: 'Verify'
        run: |
          npm run lint
          npm test
      - name: 'Build'
        run: npm run dist
      - name: 'Publish'
        run: npx lerna publish --yes
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMERGE_TOKEN }}
      - name: 'Summarize what was published'
        if: always()
        run: |
          {
            echo "### Published"
            git tag --points-at HEAD | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
