name: 'Deploy Documentation'

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  # Ref-less on purpose: the Pages deployment API is global, so two refs
  # deploying at once would race.
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v7
      - name: 'Setup Node'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: 'Setup Pages'
        uses: actions/configure-pages@v6
      - name: 'Install Dependencies'
        run: npm ci
      - name: 'Build Documentation'
        run: npx lerna run dist --scope trading-signals-docs --include-dependencies
      - name: 'Upload Artifact'
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/trading-signals-docs/dist/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 'Deploy to GitHub Pages'
        id: deployment
        uses: actions/deploy-pages@v5
