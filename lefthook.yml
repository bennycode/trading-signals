# https://lefthook.dev/configuration/
pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{css,html,json,less,md,scss,yml,yaml}'
      run: npx oxfmt {staged_files}
      stage_fixed: true
    lint:
      glob: 'packages/**/*.{js,jsx,ts,tsx}'
      # The fix run's exit code is ignored: when two rules want to rewrite the same span, oxlint
      # applies one and still reports the other, so it exits non-zero even for files it fully
      # cleaned. The final run is what decides whether the commit proceeds.
      run: |
        npx oxlint --fix {staged_files} || true
        npx oxfmt {staged_files}
        npx oxlint {staged_files}
      stage_fixed: true
