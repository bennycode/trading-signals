# https://lefthook.dev/configuration/
pre-commit:
  commands:
    oxc:
      # A merge or rebase stages code that was already linted on its own branch. Rewriting it here
      # (with --fix and stage_fixed) changes other people's code, and in a fresh checkout without a
      # built dist the type-aware rules misread imports and strip casts that are actually needed.
      skip:
        - merge
        - rebase
      run: |
        npx oxlint --fix --no-error-on-unmatched-pattern {staged_files}
        npx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    actionlint:
      glob: '.github/workflows/*.{yml,yaml}'
      run: npx github-actionlint {staged_files}
