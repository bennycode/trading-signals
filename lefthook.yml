# https://lefthook.dev/configuration/
pre-commit:
  # Not parallel: `format` rewrites the files that `lint` then reads.
  parallel: false
  commands:
    format:
      glob: '*.{cjs,css,cts,html,js,json,jsx,less,md,mjs,mts,scss,ts,tsx,yaml,yml}'
      run: npx oxfmt {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{cjs,cts,js,jsx,mjs,mts,ts,tsx}'
      run: npx oxlint {staged_files}
