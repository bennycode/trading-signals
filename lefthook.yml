# https://lefthook.dev/configuration/
pre-commit:
  # Not parallel: `format` rewrites the files that `lint` then reads.
  parallel: false
  commands:
    format:
      glob: '*.{css,html,js,json,jsx,less,md,mjs,scss,ts,tsx,yaml,yml}'
      run: npx oxfmt {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{js,jsx,mjs,ts,tsx}'
      run: npx oxlint {staged_files}
